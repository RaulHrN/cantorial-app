# Xcode project for the iOS app, generated with XcodeGen (`xcodegen generate` in this folder).
name: Cantorial
options:
  bundleIdPrefix: com.raulhrn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  CantorialCore:
    path: CantorialCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Cantorial:
    type: application
    platform: iOS
    sources:
      - path: Cantorial/Sources
      - path: Cantorial/Resources
    dependencies:
      - package: CantorialCore
        product: CantorialCore
      - package: CantorialCore
        product: CantorialAtomics
    info:
      path: Cantorial/Info.plist
      properties:
        CFBundleDisplayName: Cantorial
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: >-
          O Cantorial ouve a sua voz para mostrar as notas e a afinação. O som é analisado no
          próprio iPhone e nunca é gravado nem enviado.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raulhrn.cantorial
        PRODUCT_NAME: Cantorial
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        DEAD_CODE_STRIPPING: YES
    scheme: {}
